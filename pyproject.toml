[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastws-cli"
dynamic = ["version"]
description = "Fast workspace tools for multi-repo management"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Jeremy Howard" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
  "fastcore>=1.14.3",
  "fastgit>=0.0.7",
  "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "fastship",
  "build",
  "twine",
]

[project.scripts]
ws-clone = "fastws.core:ws_clone"
ws-pull = "fastws.core:ws_pull"
ws-status = "fastws.core:ws_status"
ws-branches = "fastws.core:ws_branches"
ws-sync = "fastws.core:ws_sync"
ws-add = "fastws.core:ws_add"
ws-remove = "fastws.core:ws_remove"

[project.urls]
Homepage = "https://github.com/AnswerDotAI/fastws"

[tool.setuptools.dynamic]
version = { attr = "fastws.__version__" }
